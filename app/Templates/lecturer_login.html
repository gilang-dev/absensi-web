<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Dosen - Universitas ABCD</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 10%,#1b2a5e,#05070d 60%);font-family:Segoe UI,Arial,sans-serif;color:#fff}
.card{width:400px;max-width:92%;padding:32px;background:#11151c;border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800}
h1{margin:0 0 4px;text-align:center;font-size:22px}
p.sub{margin:0 0 24px;text-align:center;color:#999;font-size:14px}
label{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;color:#9aa4b5}
input{width:100%;padding:13px 14px;background:#0b111c;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;font-size:15px}
input:focus{outline:none;border-color:#2563eb}
button{width:100%;margin-top:22px;min-height:48px;border:none;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
#msg{margin-top:14px;min-height:18px;text-align:center;color:#f87171;font-size:13px}
.back{display:block;margin-top:16px;text-align:center;color:#8b9bff;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<form class="card" id="form">
  <div class="logo">ABCD</div>
  <h1>Portal Dosen</h1>
  <p class="sub">Universitas ABCD</p>
  <label for="username">KODE DOSEN / EMAIL</label>
  <input id="username" autocomplete="username" placeholder="Contoh: SHE" required>
  <label for="password">PASSWORD</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
  <button id="btn" type="submit">MASUK</button>
  <div id="msg"></div>
  <a class="back" href="/">Login sebagai mahasiswa</a>
</form>
<script>
document.getElementById('form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  btn.disabled = true;
  msg.textContent = '';
  try {
    var fd = new FormData();
    fd.append('username', document.getElementById('username').value.trim());
    fd.append('password', document.getElementById('password').value);
    var res = await fetch('/api/lecturer/login', { method: 'POST', body: fd });
    var data = await res.json();
    if (data.success) { window.location.replace('/lecturer'); return; }
    msg.textContent = data.message || 'Login gagal.';
  } catch (err) {
    msg.textContent = 'Tidak dapat menghubungi server.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
